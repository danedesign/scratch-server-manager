<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browse — Sync Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    a { color: #6cb4ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .current-path { font-family: monospace; background: #1a1a1a; padding: 0.5rem 0.75rem; border-radius: 4px; margin: 1rem 0; word-break: break-all; }
    ul { list-style: none; padding: 0; max-width: 640px; }
    li { padding: 0.4rem 0; border-bottom: 1px solid #222; }
    .error { color: #f44336; }
    .select-btn { display: inline-block; margin-top: 1.5rem; padding: 0.5rem 1.25rem; background: #2f6fbf; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>
  <p><a href="/add">&larr; Back to add folder</a></p>
  <h1>Browse for a folder</h1>
  <div class="current-path">{{ current }}</div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <a class="select-btn" href="{{ select_url }}">Use this folder</a>

  <ul>
    {% if parent_url %}<li><a href="{{ parent_url }}">.. (parent directory)</a></li>{% endif %}
    {% for name, url in entries %}
    <li><a href="{{ url }}">{{ name }}/</a></li>
    {% else %}
    <li>No subfolders here.</li>
    {% endfor %}
  </ul>
</body>
</html>
